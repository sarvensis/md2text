name: md2text

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --all-targets
      - run: cargo test --doc

  linux:
    name: linux ${{ matrix.target }} (${{ matrix.manylinux }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux (glibc). aarch64 builds natively on an ARM runner,
          # so its wheel can be smoke-tested without emulation.
          - { runner: ubuntu-latest,    target: x86_64,  manylinux: auto, pypy: true, test: native }
          - { runner: ubuntu-latest,    target: x86,     manylinux: auto }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto, pypy: true, test: native }
          - { runner: ubuntu-latest,    target: armv7,   manylinux: auto }
          - { runner: ubuntu-latest,    target: ppc64le, manylinux: auto }
          - { runner: ubuntu-latest,    target: s390x,   manylinux: auto }
          # riscv64 has no manylinux2014; glibc 2.31 is the lowest baseline
          - { runner: ubuntu-latest,    target: riscv64gc-unknown-linux-gnu, manylinux: "2_31" }
          # musllinux (Alpine & co.)
          - { runner: ubuntu-latest,    target: x86_64,  manylinux: musllinux_1_2, test: alpine }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2, test: alpine }
    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # abi3 wheel for CPython; PyPy has no stable ABI, so it gets its own wheel
          args: --release --out dist ${{ matrix.pypy && '-i 3.13 pypy3.11' || '' }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: List built wheels
        shell: bash
        run: ls -lh dist

      - name: Set up Python for tests
        if: matrix.test == 'native'
        uses: actions/setup-python@v7
        with:
          # PyPy 8.0 changed the ABI tag (pp73 -> pp80); stay on 7.3 to match
          # the PyPy in the manylinux images, so every PyPy wheel is pp73.
          python-version: |
            pypy3.11-v7.3.x
            3.13

      - name: Smoke test (glibc, CPython + PyPy)
        if: matrix.test == 'native'
        shell: bash
        run: |
          set -euo pipefail
          cp python/test_md2text.py "$RUNNER_TEMP/"
          for py in python pypy3; do
            echo "::group::$py"
            "$py" -m pip install md2text --no-index --find-links dist --force-reinstall
            "$py" "$RUNNER_TEMP/test_md2text.py"
            echo "::endgroup::"
          done

      - name: Check type stubs match the module
        if: matrix.test == 'native' && matrix.target == 'x86_64'
        run: |
          python -m pip install mypy
          cd "$RUNNER_TEMP"
          python -m mypy.stubtest md2text --allowlist "$GITHUB_WORKSPACE/stubtest-allowlist.txt"

      - name: Smoke test (musl, Alpine)
        if: matrix.test == 'alpine'
        run: |
          docker run --rm -v "$PWD":/io -w /io alpine:latest sh -euc '
            apk add --no-cache python3
            python3 -m venv /venv
            /venv/bin/pip install md2text --no-index --find-links dist
            cp python/test_md2text.py /tmp/
            /venv/bin/python /tmp/test_md2text.py
          '

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.manylinux }}-${{ matrix.target }}
          path: dist

  windows:
    name: windows ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: x64,     python_arch: x64 }
          - { runner: windows-latest, target: x86,     python_arch: x86 }
          - { runner: windows-11-arm, target: aarch64, python_arch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_arch }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: List built wheels
        shell: bash
        run: ls -lh dist

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          cp python/test_md2text.py "$RUNNER_TEMP/"
          python -m pip install md2text --no-index --find-links dist --force-reinstall
          python "$RUNNER_TEMP/test_md2text.py"

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    name: macos ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-latest,   target: aarch64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # PyPy 8.0 changed the ABI tag (pp73 -> pp80); stay on 7.3 to match
          # the PyPy in the manylinux images, so every PyPy wheel is pp73.
          python-version: |
            pypy3.11-v7.3.x
            3.13

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i 3.13 pypy3.11
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: List built wheels
        shell: bash
        run: ls -lh dist

      - name: Smoke test (CPython + PyPy)
        shell: bash
        run: |
          set -euo pipefail
          cp python/test_md2text.py "$RUNNER_TEMP/"
          for py in python pypy3; do
            echo "::group::$py"
            "$py" -m pip install md2text --no-index --find-links dist --force-reinstall
            "$py" "$RUNNER_TEMP/test_md2text.py"
            echo "::endgroup::"
          done

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [rust, linux, windows, macos, sdist]
    environment: pypi
    permissions:
      id-token: write      # PyPI trusted publishing (OIDC)
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

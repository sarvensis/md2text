[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "md2text"
version = "0.1.0"
description = "Fast, safe Markdown -> plain text conversion, robust to truncated input."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
keywords = ["markdown", "plaintext", "commonmark", "streaming"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup",
]

[tool.maturin]
# Build the Python extension by enabling the gated bindings.
features = ["python"]
# Importable module name == [lib] name in Cargo.toml == #[pymodule] fn name.
module-name = "md2text"

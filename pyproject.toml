[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "md2text"
dynamic = ["version"]
description = "Fast, safe Markdown -> plain text conversion, robust to truncated input."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["markdown", "plaintext", "commonmark", "streaming"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/sarvensis/md2text"
Issues = "https://github.com/sarvensis/md2text/issues"

[tool.maturin]
# Build the Python extension by enabling the gated bindings.
features = ["python"]
# Importable module name == [lib] name in Cargo.toml == #[pymodule] fn name.
module-name = "md2text"